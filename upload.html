<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Upload Panel</title>
</head>
<body>

<h2>Admin Upload Panel</h2>

<!-- Select image -->
<input type="file" id="imageFile"><br><br>

<!-- Enter title -->
<input type="text" id="title" placeholder="Title"><br><br>

<!-- Select category -->
<select id="category">
  <option>Anal</option>
  <option>Milf</option>
  <option>Big Boobs</option>
  <option>Solo</option>
  <option>Couple</option>
  <option>Futanari/Shemale</option>
</select><br><br>

<!-- Admin password for security -->
<input type="password" id="adminPass" placeholder="Admin Password"><br><br>

<!-- Upload button -->
<button onclick="uploadImage()">Upload</button>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // ------------------ CONFIG ------------------
  const supabaseUrl = 'https://wsizrkokfnohpvklqmit.supabase.co';
  const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndzaXpya29rZm5vaHB2a2xxbWl0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjczNjc3MTIsImV4cCI6MjA4Mjk0MzcxMn0.Isj74iatm9uWKUAe1z--BzG_mdwav0in1GxBHj4RuFc';
  const supabase = supabase.createClient(supabaseUrl, supabaseKey);

  const ADMIN_PASSWORD = 'scar-III';
  // -------------------------------------------

  async function uploadImage() { 
    alert("Upload button clicked");

    const password = document.getElementById('adminPass').value;
    if(password !== ADMIN_PASSWORD) return alert('Wrong password!');

    const file = document.getElementById('imageFile').files[0];
    const title = document.getElementById('title').value;
    const category = document.getElementById('category').value;

    if(!file || !title) return alert('Please select image and enter title');

    try {
      // 1️⃣ Upload image to Supabase Storage
      const { data: storageData, error: storageError } = await supabase
        .storage
        .from('image')  // <-- YOUR bucket name
        .upload(file.name, file, { upsert: true });

      if(storageError) throw storageError;

      // 2️⃣ Get public URL
      const { data: publicUrlData, error: urlError } = supabase
        .storage
        .from('image')  // <-- YOUR bucket name
        .getPublicUrl(file.name);

      if(urlError) throw urlError;

      const publicURL = publicUrlData.publicUrl;

      // 3️⃣ Insert metadata into database
      const { error: dbError } = await supabase
        .from('images')
        .insert([{ file: publicURL, title, category }]);

      if(dbError) throw dbError;

      alert('Upload successful!');

      // Reset fields
      document.getElementById('imageFile').value = '';
      document.getElementById('title').value = '';

    } catch(err) {
      console.error(err);
      alert('Error: ' + err.message);
    }
  }
</script>

</body>
</html>
