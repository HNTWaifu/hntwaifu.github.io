<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Upload Panel</title>
</head>
<body>

<h2>Admin Upload Panel</h2>

<!-- Select image -->
<input type="file" id="imageFile"><br><br>

<!-- Enter title -->
<input type="text" id="title" placeholder="Title"><br><br>

<!-- Select category -->
<select id="category">
  <option>Anal</option>
  <option>Milf</option>
  <option>Big Boobs</option>
  <option>Solo</option>
  <option>Couple</option>
  <option>Futanari/Shemale</option>
</select><br><br>

<!-- Admin password for security -->
<input type="password" id="adminPass" placeholder="Admin Password"><br><br>

<!-- Upload button -->
<button type="button" onclick="uploadImage()">Upload</button>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ------------------ CONFIG ------------------
const supabaseUrl = 'https://djakmfyyjomtuyakpcdq.supabase.co'; // Your Supabase URL
const supabaseKey = 'djakmfyyjomtuyakpcdq'; // Your anon/public key
const supabase = supabase.createClient(supabaseUrl, supabaseKey);

const ADMIN_PASSWORD = 'scar-III'; // Admin password
// -------------------------------------------

async function uploadImage() {

  // Step 1: Check button click
  alert("Upload button clicked");

  // Step 2: Check password
  const password = document.getElementById('adminPass').value;
  if(password !== ADMIN_PASSWORD) return alert('Wrong password!');

  // Step 3: Get file, title, category
  const fileInput = document.getElementById('imageFile');
  const file = fileInput.files[0];
  const title = document.getElementById('title').value.trim();
  const category = document.getElementById('category').value;

  if(!file) return alert('Please select an image');
  if(!title) return alert('Please enter a title');

  try {
    // 1️⃣ Upload image to Supabase Storage
    const { data: storageData, error: storageError } = await supabase
      .storage.from('category')  // your bucket name (must be lowercase)
      .upload(file.name, file, { upsert: true });

    if(storageError) throw storageError;

    // 2️⃣ Get public URL
    const { data } = supabase.storage.from('category').getPublicUrl(file.name);
    const publicURL = data.publicUrl;

    if(!publicURL) throw new Error('Could not get public URL');

    // 3️⃣ Insert metadata into database
    const { error: dbError } = await supabase
      .from('images')
      .insert([{ file: publicURL, title, category }]);

    if(dbError) throw dbError;

    // 4️⃣ Success
    alert('✅ Upload successful!');

    // Reset fields
    fileInput.value = '';
    document.getElementById('title').value = '';
    document.getElementById('category').selectedIndex = 0;

  } catch (err) {
    alert('❌ Upload failed: ' + err.message);
    console.error(err);
  }
}
</script>

</body>
</html>
