<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NSFW AI Anime</title>

<style>
body {
  margin: 0;
  background: #0b0b0f;
  color: #fff;
  font-family: Arial, sans-serif;
}

a { text-decoration: none; color: inherit; }

/* HEADER */
header {
  display: flex;
  align-items: center;
  padding: 10px 15px;
  border-bottom: 1px solid purple;
}

.logo img {
  height: 40px;
  cursor: pointer;
}

/* SEARCH */
.search-box {
  margin: auto;
  display: flex;
  align-items: center;
  border: 1px solid purple;
  padding: 4px 8px;
  background: #111;
}

.search-box span {
  margin-right: 6px;
}

.search-box input {
  background: transparent;
  border: none;
  outline: none;
  color: #fff;
  width: 150px;
}

/* TELEGRAM */
.telegram {
  color: #00aaff;
  font-weight: bold;
}

/* AGE GATE */
#ageGate {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.95);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

.age-box {
  text-align: center;
  border: 2px solid purple;
  padding: 20px;
  max-width: 320px;
}

.age-btn {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
  border: 2px solid purple;
  background: transparent;
  color: #fff;
  cursor: pointer;
}

/* CATEGORIES */
.categories {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  padding: 15px;
}

/* FEED */
.feed {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
  padding: 10px;
}

.feed-item {
  border: 1px solid purple;
}

.feed-item img {
  width: 100%;
  display: block;
  cursor: pointer;
}

.feed-title {
  padding: 6px;
  font-size: 13px;
  text-align: center;
  color: #ccc;
  background: #111;
}

/* MESSAGE */
#message {
  text-align: center;
  padding: 15px;
  color: #aaa;
}

/* LIGHTBOX */
#lightbox {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.95);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 10000;
}

#lightbox img {
  max-width: 95%;
  max-height: 95%;
}
</style>
</head>

<body>

<!-- AGE GATE -->
<div id="ageGate">
  <div class="age-box">
    <p>You must be 18+</p>
    <button class="age-btn" onclick="enterSite()">I'm 18 or above – Enter</button>
    <button class="age-btn" onclick="exitSite()">I'm under 18 – Exit</button>
  </div>
</div>

<header>
  <a class="logo" href="index.html">
    <img src="images/logo/logo.png">
  </a>

  <div class="search-box">
    <span>🔍</span>
    <input type="text" id="searchInput" placeholder="Search..." oninput="handleSearch()">
  </div>

  <a class="telegram" href="telegram.html">Telegram</a>
</header>

<div class="categories" id="categories"></div>
<div id="message"></div>
<div class="feed" id="feed"></div>

<div id="lightbox" onclick="closeLightbox()">
  <img id="lightboxImg">
</div>

<script>
let ALL_DATA = [];

const ILLEGAL_WORDS = ['child','minor','underage','rape'];

function enterSite() {
  document.getElementById("ageGate").style.display = "none";
}

function exitSite() {
  history.back();
}

// LOAD DATA
fetch('images/data.json')
  .then(res => res.json())
  .then(data => {
    ALL_DATA = data.sort(() => Math.random() - 0.5);
    loadCategories(ALL_DATA);
    loadFeed(ALL_DATA);
  });

// CATEGORIES
function loadCategories(data) {
  const div = document.getElementById('categories');
  div.innerHTML = '';
  const cats = [...new Set(data.map(i => i.category))];

  cats.forEach(cat => {
    const item = data.find(i => i.category === cat);
    if (!item) return;

    const a = document.createElement('a');
    a.href = `category.html?cat=${encodeURIComponent(cat)}`;
    a.innerHTML = `
      <div style="border:2px solid purple">
        <img src="${item.file}" style="width:100%;height:180px;object-fit:cover">
        <div style="text-align:center;padding:5px">${cat}</div>
      </div>
    `;
    div.appendChild(a);
  });
}

// FEED
function loadFeed(data) {
  const feed = document.getElementById('feed');
  const msg = document.getElementById('message');
  feed.innerHTML = '';
  msg.textContent = '';

  if (!data.length) {
    msg.textContent = 'No results found.';
    return;
  }

  data.forEach(item => {
    if (item.cover) return;

    const box = document.createElement('div');
    box.className = 'feed-item';

    box.innerHTML = `
      <img src="${item.file}" onclick="openLightbox('${item.file}')">
      <div class="feed-title">${item.title || 'Untitled'}</div>
    `;
    feed.appendChild(box);
  });
}

// SEARCH (FIXED)
function handleSearch() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const categories = document.getElementById('categories');

  if (!q) {
    categories.style.display = 'grid';
    loadFeed(ALL_DATA);
    return;
  }

  if (ILLEGAL_WORDS.some(w => q.includes(w))) {
    document.getElementById('feed').innerHTML = '';
    document.getElementById('message').textContent = '⚠️ This search is not allowed.';
    return;
  }

  categories.style.display = 'none';

  const results = ALL_DATA.filter(i =>
    (i.title && i.title.toLowerCase().includes(q)) ||
    (i.category && i.category.toLowerCase().includes(q))
  );

  loadFeed(results);
}

// LIGHTBOX
function openLightbox(src) {
  document.getElementById('lightboxImg').src = src;
  document.getElementById('lightbox').style.display = 'flex';
  history.pushState({}, '', '');
}

function closeLightbox() {
  document.getElementById('lightbox').style.display = 'none';
  history.back();
}

window.onpopstate = () => {
  document.getElementById('lightbox').style.display = 'none';
};
</script>

</body>
</html>
