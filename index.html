  <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NSFW AI Anime</title>

<style>
body {
  margin: 0;
  background: #0b0b0f;
  color: #fff;
  font-family: Arial, sans-serif;
}

a { text-decoration: none; color: inherit; }

/* HEADER */
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 15px;
  border-bottom: 1px solid purple;
}

.logo img {
  height: 40px;
}

.telegram {
  color: #00aaff;
  font-weight: bold;
}

/* AGE GATE */
#ageGate {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.95);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

.age-box {
  text-align: center;
  border: 2px solid purple;
  padding: 20px;
  max-width: 320px;
}

.age-box img {
  width: 120px;
  margin-bottom: 10px;
}

.age-btn {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
  border: 2px solid purple;
  background: transparent;
  color: #fff;
  cursor: pointer;
}

/* CATEGORIES */
.categories {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  padding: 15px;
}

.category-box {
  border: 2px solid purple;
  overflow: hidden;
}

.category-box img {
  width: 100%;
  height: 180px;
  object-fit: contain;
  background: #000;
}

.category-name {
  text-align: center;
  padding: 5px;
  font-size: 14px;
}

/* FEED */
.feed {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 5px;
  padding: 10px;
}

.feed img {
  width: 100%;
  border: 1px solid purple;
  cursor: pointer;
}

/* LIGHTBOX */
#lightbox {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.95);
  display: none;
  justify-content: center;
  align-items: center;
}

#lightbox img {
  max-width: 95%;
  max-height: 95%;
}
</style>
</head>

<body>

<!-- AGE GATE -->
<div id="ageGate">
  <div class="age-box">
    <img src="images/logo/logo.png">
    <p>You must be 18+</p>
    <button class="age-btn" onclick="enterSite()">I'm 18 or above – Enter</button>
    <button class="age-btn" onclick="exitSite()">I'm under 18 – Exit</button>
  </div>
</div>

<header>
  <a class="logo" href="">
    <img src="images/logo/logo.png">
  </a>
  <a class="telegram" href="telegram.html">Telegram</a>
</header>

<!-- DYNAMIC CATEGORIES -->
<div class="categories" id="categories"></div>

<script>
// Fetch images from data.json
fetch('images/data.json')
  .then(response => response.json())
  .then(data => {
    const categoriesDiv = document.getElementById('categories');
    
    // Shuffle array for random order
    data.sort(() => Math.random() - 0.5);

    data.forEach(item => {
      // Create category box
      const box = document.createElement('a');
      box.className = 'category-box';
      box.href = `category.html?cat=${encodeURIComponent(item.category)}`;

      // Create image element
      const img = document.createElement('img');
      img.src = 'images/' + item.file;
      img.alt = item.title;

      // Category name
      const name = document.createElement('div');
      name.className = 'category-name';
      name.textContent = item.category;

      // Append image + name
      box.appendChild(img);
      box.appendChild(name);

      // Append box to categories div
      categoriesDiv.appendChild(box);
    });
  });
</script>

<script>
function enterSite() {
  document.getElementById("ageGate").style.display = "none";
}

function exitSite() {
  history.back();
}

/* =========================
   LOAD CATEGORIES (TOP)
========================= */
fetch('images/data.json')
  .then(res => res.json())
  .then(data => {
    const categoriesDiv = document.getElementById('categories');

    data.sort(() => Math.random() - 0.5);

    data.forEach(item => {
      const box = document.createElement('a');
      box.className = 'category-box';
      box.href = `category.html?cat=${encodeURIComponent(item.category)}`;

      const img = document.createElement('img');
      img.src = 'images/' + item.file;
      img.alt = item.title;

      const name = document.createElement('div');
      name.className = 'category-name';
      name.textContent = item.category;

      box.appendChild(img);
      box.appendChild(name);
      categoriesDiv.appendChild(box);
    });
  });

/* =========================
   LOAD FEED (MIXED)
========================= */
const feedDiv = document.getElementById("feed");

fetch('images/data.json')
  .then(res => res.json())
  .then(data => {
    data.sort(() => Math.random() - 0.5);

    data.forEach(item => {
      const img = document.createElement("img");
      img.src = 'images/' + item.file;
      img.alt = item.title;

      img.onclick = () => {
        document.getElementById("lightboxImg").src = img.src;
        document.getElementById("lightbox").style.display = "flex";
      };

      feedDiv.appendChild(img);
    });
  });
</script>

</body>
</html>
