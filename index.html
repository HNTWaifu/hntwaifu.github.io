<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NSFW AI Anime</title>

<style>
/* =========================
   GENERAL STYLES
========================= */
body {
  margin: 0;
  background: #0b0b0f;
  color: #fff;
  font-family: Arial, sans-serif;
}

a { text-decoration: none; color: inherit; }

/* =========================
   HEADER
========================= */
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 15px;
  border-bottom: 1px solid purple;
}

.logo img {
  height: 40px;
  cursor: pointer;
}

.telegram {
  color: #00aaff;
  font-weight: bold;
  cursor: pointer;
}

/* =========================
   AGE GATE
========================= */
#ageGate {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.95);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

.age-box {
  text-align: center;
  border: 2px solid purple;
  padding: 20px;
  max-width: 320px;
}

.age-box img {
  width: 120px;
  margin-bottom: 10px;
}

.age-btn {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
  border: 2px solid purple;
  background: transparent;
  color: #fff;
  cursor: pointer;
}

/* =========================
   CATEGORIES
========================= */
.categories {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  padding: 15px;
}

.category-box {
  border: 2px solid purple;
  overflow: hidden;
}

.category-box img {
  width: 100%;
  height: 180px;
  object-fit: cover;
  background: #000;
}

.category-name {
  text-align: center;
  padding: 5px;
  font-size: 14px;
}

/* =========================
   FEED
========================= */
.feed {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 5px;
  padding: 10px;
}

.feed img {
  width: 100%;
  border: 1px solid purple;
  cursor: pointer;
  object-fit: cover;
}

/* =========================
   LIGHTBOX
========================= */
#lightbox {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.95);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 10000;
}

#lightbox img {
  max-width: 95%;
  max-height: 95%;
}
</style>
</head>

<body>

<!-- AGE GATE -->
<div id="ageGate">
  <div class="age-box">
    <img src="images/logo/logo.png" alt="Logo">
    <p>You must be 18+</p>
    <button class="age-btn" onclick="enterSite()">I'm 18 or above – Enter</button>
    <button class="age-btn" onclick="exitSite()">I'm under 18 – Exit</button>
  </div>
</div>

<!-- HEADER -->
<header>
  <a class="logo" href="">
    <img src="images/logo/logo.png" alt="Logo" onclick="enterSite()">
  </a>
  <a class="telegram" href="telegram.html">Telegram</a>
</header>

<!-- CATEGORIES -->
<div class="categories" id="categories"></div>

<!-- HOMEPAGE FEED -->
<div class="feed" id="feed"></div>

<!-- LIGHTBOX -->
<div id="lightbox" onclick="this.style.display='none'">
  <img id="lightboxImg" alt="Preview">
</div>

<script>
// =========================
// AGE GATE
// =========================
function enterSite() {
  document.getElementById("ageGate").style.display = "none";
}
function exitSite() {
  history.back();
}

// =========================
// LOAD DATA.JSON
// =========================
fetch('images/data.json')
  .then(res => res.json())
  .then(data => {
    if (!Array.isArray(data)) return;

    // Shuffle for randomness
    data.sort(() => Math.random() - 0.5);

    loadCategories(data);
    loadFeed(data);
  })
  .catch(err => console.error('Failed to load data.json', err));

// =========================
// BUILD CATEGORIES
// =========================
function loadCategories(data) {
  const categoriesDiv = document.getElementById('categories');
  categoriesDiv.innerHTML = '';

  const uniqueCategories = [...new Set(data.map(i => i.category))];

  uniqueCategories.forEach(cat => {
    const item = data.find(i => i.category === cat);
    if (!item) return;

    const box = document.createElement('a');
    box.className = 'category-box';
    box.href = `category.html?cat=${encodeURIComponent(cat)}`;

    const img = document.createElement('img');
    img.src = item.file;
    img.alt = item.title;
    img.onerror = () => img.style.background = '#111';

    const name = document.createElement('div');
    name.className = 'category-name';
    name.textContent = cat;

    box.appendChild(img);
    box.appendChild(name);
    categoriesDiv.appendChild(box);
  });
}

// =========================
// BUILD HOMEPAGE FEED
// =========================
function loadFeed(data) {
  const feed = document.getElementById('feed');
  feed.innerHTML = '';

  // Filter out category cover images
  const feedItems = data.filter(item => !item.cover);

  feedItems.forEach(item => {
    const container = document.createElement('div');
    container.className = 'feed-item';

    const img = document.createElement('img');
    img.src = item.file;
    img.alt = item.title;
    img.onclick = () => openLightbox(item.file);
    img.onerror = () => img.style.display = 'none';

    const titleDiv = document.createElement('div');
    titleDiv.className = 'feed-title';
    titleDiv.textContent = item.title;

    container.appendChild(img);
    container.appendChild(titleDiv);
    feed.appendChild(container);
  });
   }
// =========================
// LIGHTBOX
// =========================
function openLightbox(src) {
  const lightbox = document.getElementById('lightbox');
  const img = document.getElementById('lightboxImg');
  img.src = src;
  lightbox.style.display = 'flex';
}
</script>

</body>
</html>
