<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NSFW AI Anime</title>

<style>
body {
  margin: 0;
  background: #0b0b0f;
  color: #fff;
  font-family: Arial, sans-serif;
}

a { text-decoration: none; color: inherit; }

/* HEADER */
header {
  display: flex;
  align-items: center;
  padding: 10px 15px;
  border-bottom: 1px solid purple;
}

.logo img {
  height: 40px;
  cursor: pointer;
}

/* SEARCH BAR */
.search-box {
  margin: auto;
  display: flex;
  align-items: center;
  border: 1px solid purple;
  padding: 4px 8px;
  background: #111;
}

.search-box span {
  margin-right: 6px;
}

.search-box input {
  background: transparent;
  border: none;
  outline: none;
  color: #fff;
  width: 140px;
}

/* TELEGRAM */
.telegram {
  color: #00aaff;
  font-weight: bold;
}

/* AGE GATE */
#ageGate {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.95);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

.age-box {
  text-align: center;
  border: 2px solid purple;
  padding: 20px;
  max-width: 320px;
}

.age-btn {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
  border: 2px solid purple;
  background: transparent;
  color: #fff;
  cursor: pointer;
}

/* CATEGORIES */
.categories {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  padding: 15px;
}

.category-box {
  border: 2px solid purple;
}

.category-box img {
  width: 100%;
  height: 180px;
  object-fit: cover;
}

/* FEED */
.feed {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 5px;
  padding: 10px;
}

.feed img {
  width: 100%;
  border: 1px solid purple;
  cursor: pointer;
}

/* MESSAGE */
#message {
  text-align: center;
  padding: 20px;
  color: #aaa;
}

/* LIGHTBOX */
#lightbox {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.95);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 10000;
}

#lightbox img {
  max-width: 95%;
  max-height: 95%;
}
</style>
</head>

<body>

<!-- AGE GATE -->
<div id="ageGate">
  <div class="age-box">
    <p>You must be 18+</p>
    <button class="age-btn" onclick="enterSite()">I'm 18 or above – Enter</button>
    <button class="age-btn" onclick="exitSite()">I'm under 18 – Exit</button>
  </div>
</div>

<!-- HEADER -->
<header>
  <a class="logo" href="index.html">
    <img src="images/logo/logo.png" alt="Logo">
  </a>

  <div class="search-box">
    <span>🔍</span>
    <input type="text" id="searchInput" placeholder="Search..." oninput="handleSearch()">
  </div>

  <a class="telegram" href="telegram.html">Telegram</a>
</header>

<div class="categories" id="categories"></div>
<div id="message"></div>
<div class="feed" id="feed"></div>

<!-- LIGHTBOX -->
<div id="lightbox" onclick="closeLightbox()">
  <img id="lightboxImg">
</div>

<script>
let ALL_DATA = [];
let CURRENT_VIEW = 'home';

const ILLEGAL_WORDS = [
  'child', 'minor', 'rape', 'revenge', 'underage'
];

// AGE GATE
function enterSite() {
  document.getElementById("ageGate").style.display = "none";
  history.replaceState({view:'home'}, '', '');
}
function exitSite() {
  history.back();
}

// LOAD DATA
fetch('images/data.json')
  .then(res => res.json())
  .then(data => {
    ALL_DATA = data.sort(() => Math.random() - 0.5);
    loadCategories(ALL_DATA);
    loadFeed(ALL_DATA);
  });

// BUILD CATEGORIES
function loadCategories(data) {
  const categoriesDiv = document.getElementById('categories');
  categoriesDiv.innerHTML = '';

  const uniqueCategories = [...new Set(data.map(i => i.category))];
  uniqueCategories.forEach(cat => {
    const item = data.find(i => i.category === cat);
    if (!item) return;

    const box = document.createElement('a');
    box.className = 'category-box';
    box.href = `category.html?cat=${encodeURIComponent(cat)}`;

    box.innerHTML = `
      <img src="${item.file}">
      <div style="text-align:center;padding:5px;">${cat}</div>
    `;
    categoriesDiv.appendChild(box);
  });
}

// BUILD FEED
function loadFeed(data) {
  const feed = document.getElementById('feed');
  const msg = document.getElementById('message');
  feed.innerHTML = '';
  msg.innerHTML = '';

  if (!data.length) {
    msg.textContent = 'No results found.';
    return;
  }

  data.forEach(item => {
    if (item.cover) return;

    const img = document.createElement('img');
    img.src = item.file;
    img.alt = item.title;
    img.onclick = () => openLightbox(item.file);
    feed.appendChild(img);
  });
}

// SEARCH
function handleSearch() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const msg = document.getElementById('message');

  if (ILLEGAL_WORDS.some(w => q.includes(w))) {
    msg.textContent = '⚠️ This search is not allowed.';
    document.getElementById('feed').innerHTML = '';
    return;
  }

  const results = ALL_DATA.filter(i =>
    i.title.toLowerCase().includes(q) ||
    i.category.toLowerCase().includes(q)
  );

  loadFeed(results);
}

// LIGHTBOX
function openLightbox(src) {
  document.getElementById('lightboxImg').src = src;
  document.getElementById('lightbox').style.display = 'flex';
  history.pushState({view:'image'}, '', '');
}

function closeLightbox() {
  document.getElementById('lightbox').style.display = 'none';
  history.back();
}

// BACK BUTTON FIX
window.onpopstate = () => {
  document.getElementById('lightbox').style.display = 'none';
};
</script>

</body>
</html>
