name: Upload Images from Google Form

on:
  workflow_dispatch:  # manual trigger
  schedule:
    - cron: '*/10 * * * *' # every 10 minutes

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install @octokit/rest googleapis node-fetch

      - name: Run upload script
        env:
          GITHUB_TOKEN: ${{ secrets.UPLOAD_TOKEN }}  # <-- make sure this matches your secret name
        run: node scripts/upload-from-form.mjs
