name: Upload from Google Form

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          npm install googleapis node-fetch @octokit/rest

      - name: Run upload script
        run: node script/upload-from-form.js
