<script>
// GET CATEGORY NAME
const params = new URLSearchParams(window.location.search);
const category = params.get("cat") || "general";
document.getElementById("categoryTitle").innerText = category;

// LOAD CATEGORY IMAGES
const feed = document.getElementById("feed");

fetch('images/data.json')
  .then(res => {
    console.log('Fetching data.json...', res);
    return res.json();
  })
  .then(data => {
    console.log('Data loaded:', data);

    // Filter only images of this category
    const categoryImages = data.filter(item => item.category.toLowerCase() === category.toLowerCase());
    console.log('Filtered category images:', categoryImages);

    if (categoryImages.length === 0) {
      feed.innerHTML = `<p style="text-align:center;color:red;">No images found for category: ${category}</p>`;
    }

    categoryImages.forEach(item => {
      const img = document.createElement("img");
      img.src = item.file; // uses file path from data.json
      img.alt = item.title;

      img.onerror = () => {
        console.error('Category image failed to load:', img.src);
        img.style.background = 'red';
      };

      img.onclick = () => {
        document.getElementById("lightboxImg").src = img.src;
        document.getElementById("lightbox").style.display = "flex";
      };

      feed.appendChild(img);
    });
  })
  .catch(err => console.error('Error loading data.json:', err));
</script>
